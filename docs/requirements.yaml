# Requirements from the VRM4-HIL v1.0 specification, in script-readable form.
# Single source for: GitHub issues (tools/bootstrap_github.py) and, at the
# end of the project, the traceability matrix in the D5 report.
#
# Fields:
#   id      identifier from the specification
#   prio    MUST | SHOULD | COULD
#   title   summary (the binding text remains the one in the specification)
#   verify  test or verification method (TC-xx, I = inspection, A = analysis)
#   ms      milestone by which the requirement must first be closed
#   owner   proposed owner per table 2.1: to be confirmed in D0
#
# Criterion for ms: the earliest milestone among those of its tests (table 6.1),
# brought forward when the plan requires it sooner (e.g. CI in M0).

milestones:
  M0: {week: 1,  title: "M0 Kickoff"}
  M1: {week: 3,  title: "M1 Modeling"}
  M2: {week: 5,  title: "M2 ICD, link, DPWM"}
  M3: {week: 8,  title: "M3 Plant v1 and co-simulation"}
  M4: {week: 11, title: "M4 First closed loop"}
  M5: {week: 14, title: "M5 Full features"}
  M6: {week: 16, title: "M6 Acceptance testing and release"}

requirements:
  # --- Plant on PYNQ-Z1 (4.2) ---
  - {id: PLT-01, prio: MUST,   ms: M3, owner: A+D, verify: [TC-01, TC-02, TC-20], title: "Real-time model of the 4-phase buck, fixed step <= 50 ns, deterministic"}
  - {id: PLT-02, prio: MUST,   ms: M3, owner: D,   verify: [TC-01, TC-02, TC-04], title: "Gate capture at 2.5 ns and sub-step averaging"}
  - {id: PLT-03, prio: MUST,   ms: M3, owner: A,   verify: [TC-02, TC-04, TC-13], title: "Four leg states, discontinuous conduction, shoot-through as a fault"}
  - {id: PLT-04, prio: MUST,   ms: M4, owner: A,   verify: [TC-07, TC-09, TC-20], title: "Programmable load generator (steps, ramps, sine wave, arbitrary profile)"}
  - {id: PLT-05, prio: MUST,   ms: M5, owner: A,   verify: [TC-11, TC-15],        title: "Programmable input voltage (steps, ramps, dips)"}
  - {id: PLT-06, prio: MUST,   ms: M3, owner: A,   verify: [TC-02, TC-18],        title: "Virtual sensors: quantization, errors, noise, delay; sampling at +-10 ns"}
  - {id: PLT-07, prio: MUST,   ms: M2, owner: D,   verify: [TC-03],               title: "v1.0 frame transmission with bounded, constant latency"}
  - {id: PLT-08, prio: MUST,   ms: M5, owner: A,   verify: [TC-13, TC-14, TC-15, TC-16], title: "Fault injection"}
  - {id: PLT-09, prio: MUST,   ms: M3, owner: A+D, verify: [TC-05, TC-07],        title: "Synchronous multichannel capture with trigger and DMA to the PS"}
  - {id: PLT-10, prio: MUST,   ms: M3, owner: A+D, verify: [TC-02],               title: "Gate edge log with 2.5 ns timestamp"}
  - {id: PLT-11, prio: MUST,   ms: M5, owner: A,   verify: [TC-08],               title: "Frequency response analyzer, mode A"}
  - {id: PLT-12, prio: MUST,   ms: M5, owner: A,   verify: [TC-09],               title: "Closed-loop output impedance measurement"}
  - {id: PLT-13, prio: SHOULD, ms: M5, owner: A,   verify: [TC-08],               title: "Frequency response analyzer, mode B, and comparison with mode A"}
  - {id: PLT-14, prio: MUST,   ms: M3, owner: A,   verify: [TC-01, I],            title: "Python package vrm4hil in SI units, tested on the board"}
  - {id: PLT-15, prio: MUST,   ms: M3, owner: A,   verify: [TC-13, TC-20],        title: "Model self-diagnosis: saturations and destructive fault"}
  - {id: PLT-16, prio: MUST,   ms: M3, owner: A+D, verify: [TC-01],               title: "Internal PWM generator for standalone operation"}
  - {id: PLT-17, prio: SHOULD, ms: M5, owner: A,   verify: [TC-07],               title: "Two-branch output network with ESL"}
  - {id: PLT-18, prio: COULD,  ms: M6, owner: A,   verify: [A],                   title: "Thermal model of the DCR"}
  - {id: PLT-19, prio: COULD,  ms: M6, owner: A,   verify: [TC-20],               title: "Library of AI-style load profiles"}
  - {id: PLT-20, prio: COULD,  ms: M6, owner: D,   verify: [TC-02],               title: "1.25 ns capture (ISERDES) and step <= 25 ns"}

  # --- Controller on iCE40UP5K (4.3) ---
  - {id: CTL-01, prio: MUST,   ms: M2, owner: D, verify: [I],             title: "RTL and device primitives only, open source toolchain"}
  - {id: CTL-02, prio: MUST,   ms: M2, owner: D, verify: [TC-04],         title: "4-phase interleaved DPWM, 500 kHz, step <= 5 ns"}
  - {id: CTL-03, prio: MUST,   ms: M2, owner: D, verify: [TC-04, TC-06],  title: "Effective duty resolution <= 2^-16 with dither or sigma-delta"}
  - {id: CTL-04, prio: MUST,   ms: M2, owner: D, verify: [TC-04, VER-03], title: "Dead time on both edges, minimum times, H and L never both high"}
  - {id: CTL-05, prio: MUST,   ms: M2, owner: D, verify: [TC-04],         title: "Programmable maximum duty, safe per-phase enable"}
  - {id: CTL-06, prio: MUST,   ms: M2, owner: D, verify: [TC-03, TC-04],  title: "SAMPLE_REQ synchronous with the carriers, programmable delay"}
  - {id: CTL-07, prio: MUST,   ms: M2, owner: D, verify: [TC-03, TC-16],  title: "Link receiver: CRC, sequence, timeout, CDC, counters"}
  - {id: CTL-08, prio: MUST,   ms: M4, owner: D, verify: [TC-06, TC-07, TC-08], title: "Programmable digital compensator, anti-windup, bumpless"}
  - {id: CTL-09, prio: MUST,   ms: M4, owner: D, verify: [TC-06, TC-09],  title: "AVP with programmable R_LL"}
  - {id: CTL-10, prio: MUST,   ms: M5, owner: D, verify: [TC-10],         title: "Active balancing of phase currents"}
  - {id: CTL-11, prio: MUST,   ms: M4, owner: D, verify: [TC-05, TC-12],  title: "Soft-start, VID transitions, sequencing, PGOOD"}
  - {id: CTL-12, prio: MUST,   ms: M5, owner: D, verify: [TC-13, TC-14, TC-15, TC-16], title: "Protections with latched fault and restart on command"}
  - {id: CTL-13, prio: MUST,   ms: M4, owner: D, verify: [TC-18],         title: "Configuration and telemetry over UART"}
  - {id: CTL-14, prio: SHOULD, ms: M5, owner: D, verify: [TC-05],         title: "Startup with preloaded output (pre-bias)"}
  - {id: CTL-15, prio: SHOULD, ms: M5, owner: D, verify: [TC-11],         title: "Input voltage feedforward"}
  - {id: CTL-16, prio: SHOULD, ms: M6, owner: D, verify: [TC-19],         title: "PMBus subset over I2C"}
  - {id: CTL-17, prio: COULD,  ms: M6, owner: D, verify: [TC-07],         title: "Nonlinear transient control"}
  - {id: CTL-18, prio: COULD,  ms: M6, owner: D, verify: [A],             title: "Phase shedding and diode emulation"}
  - {id: CTL-19, prio: COULD,  ms: M6, owner: D, verify: [D],             title: "Mini internal logic analyzer in SPRAM"}
  - {id: CTL-20, prio: COULD,  ms: M6, owner: D, verify: [TC-04],         title: "Hybrid DPWM with resolution <= 2.5 ns"}
  - {id: CTL-21, prio: MUST,   ms: M2, owner: D, verify: [TC-17],         title: "LUT <= 80%, timing margin >= 5% over three seeds"}

  # --- Interfaces (4.4) ---
  - {id: IF-01, prio: MUST,   ms: M2, owner: A+D, verify: [I, TC-03], title: "Physical connection per table 5.1"}
  - {id: IF-02, prio: MUST,   ms: M2, owner: A+D, verify: [I],        title: "LVCMOS33, safe states at power-up, documented sequencing"}
  - {id: IF-03, prio: MUST,   ms: M2, owner: D,   verify: [TC-03],    title: "Sensor link v1.0 frame, SCLK 50 MHz, CRC-8"}
  - {id: IF-04, prio: MUST,   ms: M4, owner: D,   verify: [TC-18],    title: "Configuration UART between PYNQ-Z1 and iCE40"}
  - {id: IF-05, prio: SHOULD, ms: M6, owner: D,   verify: [TC-19],    title: "I2C/PMBus bus between the boards"}
  - {id: IF-06, prio: MUST,   ms: M2, owner: A+D, verify: [I],        title: "Register maps versioned in D2"}
  - {id: IF-07, prio: COULD,  ms: M6, owner: D,   verify: [TC-03],    title: "Link in DDR mode"}

  # --- Performance (4.5) ---
  - {id: PRF-01, prio: MUST, ms: M4, owner: A+D, verify: [TC-06], title: "Static regulation within 2 mV of the load line"}
  - {id: PRF-02, prio: MUST, ms: M4, owner: A+D, verify: [TC-06], title: "Load line slope within +-5%"}
  - {id: PRF-03, prio: MUST, ms: M4, owner: A+D, verify: [TC-06], title: "Vout ripple <= 6 mV peak-to-peak"}
  - {id: PRF-04, prio: MUST, ms: M4, owner: A+D, verify: [TC-06], title: "Limit cycle <= 1.5 mV peak-to-peak"}
  - {id: PRF-05, prio: MUST, ms: M4, owner: A+D, verify: [TC-07], title: "20-80 A step: +-25 mV, settling <= 80 us"}
  - {id: PRF-06, prio: MUST, ms: M5, owner: A+D, verify: [TC-08], title: "Loop gain: fc >= 35 kHz, margins, deviation from the model"}
  - {id: PRF-07, prio: MUST, ms: M5, owner: A+D, verify: [TC-09], title: "Output impedance <= 3.5 R_LL"}
  - {id: PRF-08, prio: MUST, ms: M5, owner: A+D, verify: [TC-10], title: "Current sharing within +-5%"}
  - {id: PRF-09, prio: MUST, ms: M5, owner: A+D, verify: [TC-11], title: "Line transient <= 15 mV"}
  - {id: PRF-10, prio: MUST, ms: M4, owner: A+D, verify: [TC-05], title: "Soft-start: duration, monotonicity, overshoot, PGOOD"}
  - {id: PRF-11, prio: MUST, ms: M5, owner: A+D, verify: [TC-12], title: "VID transition 0.8-0.9 V"}
  - {id: PRF-12, prio: MUST, ms: M5, owner: A+D, verify: [TC-13, TC-14, TC-15, TC-16], title: "Protection response times"}
  - {id: PRF-13, prio: MUST, ms: M4, owner: A+D, verify: [TC-18], title: "Telemetry accuracy and rate"}
  - {id: PRF-14, prio: MUST, ms: M3, owner: A+D, verify: [TC-01, TC-02], title: "Plant fidelity: bit-exact in simulation, bounded deviation on the bench"}
  - {id: PRF-15, prio: MUST, ms: M6, owner: A+D, verify: [TC-20], title: "Robustness: one hour with random load and no faults"}

  # --- Verification and quality (4.6) ---
  - {id: VER-01, prio: MUST,   ms: M1, owner: A+D, verify: [I, TC-02], title: "Python models: average, switched, bit-true"}
  - {id: VER-02, prio: MUST,   ms: M2, owner: D,   verify: [I],        title: "cocotb tests for every RTL module against the bit-true model"}
  - {id: VER-03, prio: MUST,   ms: M2, owner: D,   verify: [I],        title: "SymbiYosys formal proofs P1-P6"}
  - {id: VER-04, prio: MUST,   ms: M3, owner: A+D, verify: [TC-07],    title: "Closed-loop co-simulation before HIL"}
  - {id: VER-05, prio: MUST,   ms: M0, owner: D,   verify: [I],        title: "Continuous integration on GitHub Actions, main always green"}
  - {id: VER-06, prio: MUST,   ms: M6, owner: D,   verify: [I],        title: "Automated acceptance testing on the PYNQ-Z1 with a single command"}
  - {id: VER-07, prio: MUST,   ms: M3, owner: D,   verify: [I],        title: "Reproducible builds: Vivado from Tcl, pinned versions"}
  - {id: VER-08, prio: SHOULD, ms: M5, owner: D,   verify: [I],        title: "Controller RTL coverage >= 90%"}
  - {id: VER-09, prio: SHOULD, ms: M1, owner: A,   verify: [A],        title: "Cross-check with a circuit simulator"}

  # --- Documentation (4.7) ---
  - {id: DOC-01, prio: MUST,   ms: M1, owner: A+D, verify: [I], title: "D1 modeling and budget report"}
  - {id: DOC-02, prio: MUST,   ms: M2, owner: A+D, verify: [I], title: "ICD and register maps (D2)"}
  - {id: DOC-03, prio: MUST,   ms: M6, owner: A+D, verify: [I], title: "D5 acceptance report with traceability matrix"}
  - {id: DOC-04, prio: MUST,   ms: M6, owner: A+D, verify: [I], title: "README with quick start in under 15 minutes"}
  - {id: DOC-05, prio: SHOULD, ms: M6, owner: A+D, verify: [I], title: "Demo video and one-page summary"}
  - {id: DOC-06, prio: MUST,   ms: M6, owner: A+D, verify: [I], title: "Decision log: at least 5 ADRs"}
