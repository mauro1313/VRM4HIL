# Single source of truth for the register maps (IF-06, § 5.5).
# From here are generated: Verilog constants, Python classes, D2 tables (`make docs`).
# The schema below is a proposal: it must be confirmed with the ICD review in M2.
#
# Fields per register:
#   name, addr, width (16|32), access (R|W|RW|W1C), reset, unit, format (Qm.n or "bits"),
#   shadow (true if part of a group with atomic application), desc

icd_version: "1.0"

blocks:
  plant:
    bus: axi-lite
    registers:
      - name: ID
        addr: 0x000
        width: 32
        access: R
        reset: 0x00000000   # TODO: encoding of identifier + ICD version
        format: bits
        desc: Block identification and ICD version (fixed address)

  ctrl:
    bus: uart
    registers:
      - name: ID
        addr: 0x00
        width: 32
        access: R
        reset: 0x00000000   # TODO
        format: bits
        desc: Controller identification, ICD version, and firmware version
